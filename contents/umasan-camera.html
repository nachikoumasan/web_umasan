<body>
<main class="camera-app">
<header class="camera-header"><a class="back" href="../index.html" aria-label="旅するうまさんTOPへ"><img src="../media/camera-return.png" alt=""><span>旅するうまさんTOPへ</span></a><h1 class="sr-only">うまさんカメラ</h1><button id="flip" type="button" aria-label="前後のカメラを切り替える" disabled><img src="../media/camera-flip-rendered.png" alt=""></button><button id="view-only" type="button" aria-label="操作を隠す。映像をタップで再表示" aria-pressed="false"><img src="../media/camera-fullscreen.png" alt=""></button></header>
<section class="camera-stage" aria-label="撮影プレビュー">
<canvas id="camera-canvas" width="1080" height="1440" tabindex="0" aria-label="うまさんをタップして選択、ドラッグで移動。選択したうまさんは右下のハンドルか2本指で拡大・回転。背景を2本指でズーム。Enterでうまさんを順に選択、矢印で移動、プラス・マイナスでサイズ、Rで回転、Deleteで削除。" hidden></canvas>
<div id="stamp-selection" hidden><button id="stamp-delete" type="button" aria-label="選択したうまさんを削除">×</button><button id="stamp-mirror" type="button" aria-label="選択したうまさんを左右反転">↔</button><button id="stamp-transform" type="button" aria-label="ドラッグでうまさんを拡大・回転。矢印キーでも調整できます。">↗</button></div>
<img id="camera-review" alt="撮影した写真。長押しでも保存できます。" hidden>
<div id="camera-welcome"><img src="../media/camera-pose-front.png" alt="リュックとランタンを持ったうまさん"><h2>うまさんと、一枚。</h2><p>カメラを許可すると、そのまま撮影できます。</p><button id="start" type="button">カメラを起動</button><label class="photo-label" for="photo-input">写真を選んで楽しむ</label><p>写真はこの端末内で合成します。</p></div>
</section>
<section class="camera-tools" aria-label="撮影とスタンプ追加">
<p id="camera-status" role="status">カメラを準備しています…</p>
<div id="pose-list" aria-label="追加するうまさんのポーズ" hidden></div>
<div class="capture-row"><label class="photo-label camera-icon-button" for="photo-input" aria-label="写真を選ぶ"><img src="../media/camera-gallery-rendered.png" alt=""></label><button id="capture" class="camera-shutter" type="button" aria-label="撮影する" disabled><img src="../media/camera-capture.png" alt=""></button><button id="poses-toggle" class="camera-icon-button" type="button" aria-label="ポーズを選んでうまさんを追加" aria-expanded="false" aria-controls="pose-list"><img src="../media/camera-pose-front.png" alt=""><span>＋</span></button><button id="retake" class="camera-icon-button" type="button" aria-label="調整に戻る" hidden><img src="../media/camera-reset-rendered.png" alt=""></button><a id="share" class="camera-icon-button review-action" href="https://x.com/intent/tweet" target="_blank" rel="noopener noreferrer" aria-label="Xでシェア" hidden><span class="x-mark" aria-hidden="true">𝕏</span><span>Xでシェア</span></a><button id="save" class="camera-icon-button review-action" type="button" aria-label="画像を保存" hidden><img src="../media/camera-save-rendered.png" alt=""><span>画像を保存</span></button></div>
<p id="save-help" role="status" hidden></p>
</section>
</main>
<input id="photo-input" type="file" accept="image/*" hidden>
<video id="camera-video" autoplay muted playsinline aria-hidden="true" tabindex="-1"></video>
</body></html>
