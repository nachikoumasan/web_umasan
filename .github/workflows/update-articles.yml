name: Update note articles

on:
  schedule:
    - cron: '0 22 * * *'   # 毎日 22:00 UTC = 翌朝 7:00 JST
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/update_note.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/articles-auto.json
          git diff --staged --quiet || git commit -m "Update note articles $(date +'%Y-%m-%d')"
          git push
